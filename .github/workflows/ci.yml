# CI：仓库里**能在普通机器上跑完**的那几件事。
#
# 分工（与本地三条流水线一一对应）：
#   · npm test       —— 纯逻辑（契约层、指纹、计划、校验器、真值夹具的自检）
#   · sciviz verify  —— 真值夹具：算得**对不对**（要宿主，CPU 就够；torch 不是必需的）
#   · agent-blind    —— agent 的整圈：读 → 写 → 判 → 跑 → 报（G4 的判据）
#
# 刻意**不**做的两件事：
#   · 不跑 e2e（要真浏览器 + 真 GPU 训练；那是本机的 `npm run e2e`，见 AGENTS.md §3）；
#   · 不装 torch（4GB 的 CUDA 构建与 GPU 都只在开发机上有意义）。宿主会如实报
#     "CPU · 未装 torch"，而共享算子照样能跑 —— 这正是执行面分流该有的样子。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # 纯逻辑：不需要 Python，跑得最快，所以单独一个 job —— 它红了就不用往下看
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sciviz-web/package-lock.json
      - run: npm ci
        working-directory: sciviz-web
      - run: npm run typecheck
        working-directory: sciviz-web
      - run: npm test
        working-directory: sciviz-web

  # agent 面：起一个宿主（不带 torch），把 verify 与盲测都真跑一遍
  agent-face:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sciviz-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
        working-directory: sciviz-web

      # 宿主本体（fastapi/uvicorn/numpy/pandas）+ 共享算子要用到的两个库。
      # 版本与浏览器端 Pyodide 对齐这件事由 `sciviz-local/pyproject.toml` 钉住。
      - name: 装宿主
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sciviz-local
          pip install scipy scikit-learn

      # 宿主与两条用例放在**同一个 step** 里：进程的生命周期归这个 shell 管，
      # 跑完一定收干净（跨 step 留后台进程是"偶尔绿、偶尔红"的经典来源）
      - name: 起宿主 → 真值夹具 → 盲测
        shell: pwsh
        working-directory: sciviz-web
        run: |
          $scivizHostProcess = Start-Process -FilePath python -ArgumentList '-m','sciviz_host','--port','8765' -PassThru -WindowStyle Hidden
          try {
            $up = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 2
                if ($r.ok) { Write-Host "宿主就绪：$($r.device.summary)"; $up = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $up) { throw '宿主 60 秒内没起来' }

            npm run verify
            if ($LASTEXITCODE -ne 0) { throw "verify 没过（退出码 $LASTEXITCODE）" }

            npm run blind
            if ($LASTEXITCODE -ne 0) { throw "盲测没过（退出码 $LASTEXITCODE）" }

            npm run mcp-smoke
            if ($LASTEXITCODE -ne 0) { throw "MCP 冒烟没过（退出码 $LASTEXITCODE）" }
          } finally {
            Stop-Process -Id $scivizHostProcess.Id -Force -ErrorAction SilentlyContinue
          }
